name: Atlas integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate knowledge graph
        run: python3 scripts/atlas.py validate --strict
      - name: Check generated indexes and graph
        run: python3 scripts/atlas.py index --check
      - name: Check NotebookLM export
        run: python3 scripts/atlas.py export notebooklm --check
      - name: Evaluate bounded retrieval
        run: python3 scripts/atlas.py eval
      - name: Run harness tests
        run: python3 -m unittest discover -s tests -v
